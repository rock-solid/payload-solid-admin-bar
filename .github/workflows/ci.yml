name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    env:
      PAYLOAD_SECRET: ci-only-not-a-secret
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      # Builds the package between the two: the demo's types come from its dist/
      - name: Typecheck (package and demo)
        run: pnpm typecheck
      # Component tests run in the runner's Google Chrome (see vitest.config.mts)
      - name: Tests
        run: pnpm test
      # The demo installs the built package from the workspace, as a site installs it from npm
      - name: Build the package and the demo
        run: pnpm demo:build
